<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mentoring · Zeta Beta Xi</title>
  <!-- This page moved to mentoring.html in upgrade55. The stub stays because the old
       address is already sitting in digest emails that went out to brothers — a 404 in
       an email nobody can edit is a dead end for as long as that inbox exists.
       canonical points at the new page so search engines index one of them, not two.
       The meta refresh is the fallback for a browser with JS off; location.replace
       runs first and keeps the old URL out of the back-button history, so "back"
       returns to where the brother actually came from instead of bouncing him here. -->
  <link rel="canonical" href="https://zetabetaxi.com/mentoring" />
  <meta name="robots" content="noindex, follow" />
  <meta http-equiv="refresh" content="0; url=mentoring.html" />
  <link rel="icon" href="assets/img/favicon.png" />
  <!-- The redirect is usually instant, but on a slow connection this stub paints
       for a moment. Without these it flashed white at a brother who had chosen
       dark mode. Inline and script-light on purpose: this page must stay fast. -->
  <script>try{var _t=localStorage.getItem("zbxi-theme")||"light";document.documentElement.dataset.theme=_t;}catch(e){}</script>
  <style>
    :root { --bg: #F7F5EF; --fg: #12151C; }
    :root[data-theme="dark"] { --bg: #050505; --fg: #ecdcaa; }
    body { background: var(--bg); color: var(--fg); margin: 0; }
  </style>
  <script>try{location.replace('mentoring.html' + location.search + location.hash);}catch(e){location.href='mentoring.html';}</script>
</head>
<body>
  <p style="font-family:system-ui,sans-serif;padding:2rem;text-align:center">
    Find a Mentor is now <a href="mentoring.html">Mentoring</a>.
  </p>
</body>
</html>
